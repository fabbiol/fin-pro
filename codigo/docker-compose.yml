# Uso no EasyPanel: New → Compose → este arquivo.
# HTTPS e domínio ficam no painel, não aqui. Uma réplica só (SQLite + Telegram).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LEITOR_HOST: "0.0.0.0"
      LEITOR_PORT: "8000"
      LEITOR_ABRIR_NAVEGADOR: "0"
      LEITOR_DADOS_DIR: "/app/dados"
      LEITOR_BACKUP_PASTA: "/backup"
      TZ: "America/Cuiaba"
      # Senha da integração com a Operações (aba Transferências de clientes).
      OPERACOES_TOKEN: ${OPERACOES_TOKEN:-}
    volumes:
      - /opt/finpro/dados:/app/dados
      # Pasta do backup total, fora da pasta de dados como o backup exige (na VPS: /opt/finpro/backup). O sistema
      # passa a usá-la sozinho quando a pasta configurada não existe (LEITOR_BACKUP_PASTA).
      - /opt/finpro/backup:/backup
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 45s
